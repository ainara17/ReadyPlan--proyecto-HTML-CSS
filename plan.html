<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readyplan</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/variantes.css">
    <link rel="stylesheet" href="./css/planStyles.css">
</head>

<body>

    <header class="main__header">
        <h1>Tu plan de acción</h1>
        <p></p>
        <div class="badge">

            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-award">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M6 9a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" />
                <path d="M12 15l3.4 5.89l1.598 -3.233l3.598 .232l-3.4 -5.889" />
                <path d="M6.802 12l-3.4 5.89l3.598 -.233l1.598 3.232l3.4 -5.889" />
            </svg>
            <p class="badge__text">0 puntos</p>
        </div>



    </header>

    <aside class="sidebar">

        <img id="logo" src="./assets/logo.jpeg" alt="icono">

        <nav class="navbar">

            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="index.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-brand-apple-arcade">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M10 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                            <path
                                d="M20 12.5v4.75a.734 .734 0 0 1 -.055 .325a.704 .704 0 0 1 -.348 .366l-5.462 2.58a5 5 0 0 1 -4.27 0l-5.462 -2.58a.705 .705 0 0 1 -.401 -.691l0 -4.75" />
                            <path
                                d="M4.431 12.216l5.634 -2.332a5.065 5.065 0 0 1 3.87 0l5.634 2.332a.692 .692 0 0 1 .028 1.269l-5.462 2.543a5.064 5.064 0 0 1 -4.27 0l-5.462 -2.543a.691 .691 0 0 1 .028 -1.27" />
                            <path d="M12 7l0 6" />
                        </svg>
                        <p>Simulación</p>
                    </a>
                </li>
                <li class="nav__item">
                    <a class="nav__link " href="guias.html">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-notebook">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-11a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1m3 0v18" />
                            <path d="M13 8l2 0" />
                            <path d="M13 12l2 0" />
                        </svg>

                        <p>Aprender</p>
                    </a>
                </li>
                <li class="nav__item">
                    <a class="nav__link nav__item--active" href="./plan.html">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-checklist">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M9.615 20h-2.615a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8" />
                            <path d="M14 19l2 2l4 -4" />
                            <path d="M9 8h4" />
                            <path d="M9 12h2" />
                        </svg>

                        <p>Tu plan</p>
                    </a>
                </li>
            </ul>

        </nav>


    </aside>

    <main class="content__plan">

        <form action="" method="post" autocomplete="off">

            <fieldset>
                <legend>1.Vivienda y entorno</legend>

                <label for="municipio">Municipio*</label>
                <input type="text" id="municipio" name="municipio" required placeholder="Ej: Bilbao">

                <label for="calle">Calle*</label>
                <input type="text" id="calle" name="calle" required placeholder="Ej: Avenida de la libertad">


                <div>
                    <label for="inmueble">Tipo de inmueble*</label>
                    <select name="inmueble" id="inmueble" required>
                        <option value="" disabled selected>Selecciona tipo...</option>
                        <option value="Piso en altura">Piso en altura</option>
                        <option value="Bajo o primer piso">Bajo o primer piso</option>
                        <option value="Chalet o adosado">Chalet o adosado</option>
                        <option value="Casa en entorno rural">Casa en entorno rural</option>
                    </select>

                    <label for="planta">Planta (si aplica)</label>
                    <input type="number" max="30" min="1" name="planta" id="planta">

                </div>

            </fieldset>
            <fieldset>
                <legend>2. Integrantes y Necesidades Especiales </legend>
                <div class="persons">
                    <div>
                        <label for="adultos">Adultos <span>*</span></label>
                        <input type="number" name="adultos" id="adultos" required>

                    </div>

                    <div>
                        <label for="niños">Niños/bebés</label>
                        <input type="number" name="niños" id="niños">

                    </div>

                    <div>
                        <label for="mayores">Mayores (65+)</label>
                        <input type="number" name="mayores" id="mayores">

                    </div>


                </div>

                <label for="mascotas">Mascotas</label>
                <input type="text" name="mascotas" id="mascotas" placeholder="Ej: 2 gatos">



                <article>
                    <label>Requerimientos Especiales</label>
                    <div class="checkbox__list">
                        <div class="checkbox__item">
                            <input type="checkbox" id="movilidad" name="movilidad" value="movilidad reducida">
                            <label for="movilidad">Persona con movilidad reducida</label>

                        </div>

                        <div class="checkbox__item">
                            <input type="checkbox" id="medicació¡on" name="medicacion" value="medicacion requerida">
                            <label for="">Medicación continua que requiere cadena de frío (Insulina, etc.)</label>

                        </div>

                        <div class="checkbox__item">

                            <input type="checkbox" id="equipo" name="equipo" value="equipo medico requerido">
                            <label for="equipo">Equipos médicos eléctricos (Concentrador de oxígeno, etc.)</label>
                        </div>

                    </div>

                </article>


            </fieldset>
            <button type="submit" class="btn__plan">Generar plan personalizado</button>

        </form>


    </main>

</body>

</html>
